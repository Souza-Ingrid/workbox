<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkBox - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <a href="index.html" class="logo">Work<span>Box</span></a>
    <nav>
      <a href="index.html">Buscar Serviços</a>
      <a href="login.html" class="active">Entrar</a>
      <a href="cadastro.html">Cadastrar</a>
    </nav>
  </header>

  <main class="container">
    <div class="form-card" style="max-width: 420px;">
      <h2>Acessar o WorkBox</h2>
      
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="loginEmail">E-mail *</label>
          <input type="email" id="loginEmail" maxlength="120" required placeholder="seu@email.com">
        </div>

        <div class="form-group">
          <label for="loginSenha">Senha *</label>
          <input type="password" id="loginSenha" maxlength="64" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn-submit">Entrar</button>
      </form>

      <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        Ainda não tem conta? <a href="cadastro.html" style="color: var(--accent-cyan); text-decoration: none;">Cadastre-se aqui</a>.
      </p>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
